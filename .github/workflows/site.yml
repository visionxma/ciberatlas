# Publica o site de busca no GitHub Pages: site/ + api/ + llms.txt.
# Roda quando o site muda e depois de cada passada do robô (o commit do robô leva
# [skip ci], então o gatilho de push não dispararia sozinho).
name: site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_run:
    workflows: [robo]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Montar a pasta publicada
        run: |
          mkdir -p _site
          cp -R site/. _site/
          cp -R api _site/api
          cp llms.txt _site/llms.txt
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
