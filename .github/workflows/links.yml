# Testa toda semana os links dos guias e dos itens fora do GitHub; link quebrado abre issue.
name: links

on:
  schedule:
    - cron: "43 7 * * 3"   # toda quarta, 07:43 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-concurrency 8 --timeout 30 --max-retries 2
            --accept 200,206,403,429
            --exclude-path catalogo --exclude-path api --exclude-path llms.txt
            --exclude cncs\.gov\.pt
            README.md README.en.md CONTRIBUTING.md CONTRIBUTING.en.md docs dados
          fail: false
          output: ./lychee/relatorio.md
      - name: Abrir issue se houver link quebrado
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: "Links quebrados encontrados pelo robô"
          content-filepath: ./lychee/relatorio.md
          labels: problema, robô
