- nome: Chainsaw
  repo: WithSecureOpenSource/chainsaw
  categoria: regras-de-deteccao
  desc: Busca rápida em registros do Windows (EVTX) aplicando regras Sigma e regras próprias.
  desc_en: Fast search through Windows event logs (EVTX) applying Sigma and custom rules.
  tags: [sigma, evtx, windows]
- nome: Hayabusa
  repo: Yamato-Security/hayabusa
  categoria: regras-de-deteccao
  desc: Caça a ameaças e linha do tempo forense em logs de eventos do Windows, com base em regras Sigma.
  desc_en: Sigma-based threat hunting and fast forensic timeline generator for Windows event logs.
  tags: [sigma, windows, timeline]
- nome: Zircolite
  repo: wagga40/Zircolite
  categoria: regras-de-deteccao
  desc: Detector autônomo que aplica regras Sigma a logs EVTX, Auditd e Sysmon para Linux.
  desc_en: Standalone detection tool that applies Sigma rules to EVTX, Auditd and Sysmon for Linux logs.
  tags: [sigma, evtx, linux]
- nome: Atomic Red Team
  repo: redcanaryco/atomic-red-team
  categoria: regras-de-deteccao
  desc: Testes pequenos e portáteis do MITRE ATT&CK para checar se as suas detecções disparam.
  desc_en: Small, portable MITRE ATT&CK tests to check whether your detections actually fire.
  tags: [mitre-attack, validacao]

# --- deteccao-de-rede
- nome: Suricata
  repo: OISF/suricata
  categoria: deteccao-de-rede
  desc: Motor aberto de detecção e prevenção de intrusão e monitoramento de segurança de rede.
