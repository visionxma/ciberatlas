# --- regras-de-deteccao
- nome: Sigma
  repo: SigmaHQ/sigma
  categoria: regras-de-deteccao
  desc: Repositório principal de regras Sigma, formato aberto de detecção que vale para vários SIEMs.
  desc_en: Main Sigma rule repository, an open detection format that works across many SIEMs.
