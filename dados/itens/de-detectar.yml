- nome: RITA
  repo: activecm/rita
  categoria: deteccao-de-rede
  desc: Analisa logs do Zeek para achar comunicação de comando e controle por beaconing.
  desc_en: Analyzes Zeek logs to detect command-and-control communication through beaconing.
