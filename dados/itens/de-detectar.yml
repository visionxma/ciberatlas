- nome: pySigma
  repo: SigmaHQ/pySigma
  categoria: regras-de-deteccao
  desc: Biblioteca Python que lê regras Sigma e as converte em consultas para cada SIEM.
  desc_en: Python library that parses Sigma rules and converts them into queries for each SIEM.
  tags: [sigma, python]
- nome: Elastic Detection Rules
  repo: elastic/detection-rules
  categoria: regras-de-deteccao
  desc: Regras de detecção do Elastic Security e ferramentas para criá-las, testá-las e mantê-las.
  desc_en: Elastic Security detection rules plus tooling to create, test and maintain them.
  tags: [elastic, regras]
- nome: Splunk Security Content
  repo: splunk/security_content
  categoria: regras-de-deteccao
  desc: Detecções, análises e playbooks do Splunk mapeados ao MITRE ATT&CK.
  desc_en: Splunk detections, analytic stories and playbooks mapped to MITRE ATT&CK.
  tags: [splunk, regras, mitre-attack]
- nome: Microsoft Sentinel (Azure-Sentinel)
  repo: Azure/Azure-Sentinel
  categoria: regras-de-deteccao
  desc: Regras de análise, consultas de caça e conectores de dados da comunidade do Microsoft Sentinel.
  desc_en: Community analytics rules, hunting queries and data connectors for Microsoft Sentinel.
  tags: [sentinel, kql, regras]
- nome: signature-base
  repo: Neo23x0/signature-base
  categoria: regras-de-deteccao
  desc: Base de assinaturas YARA e indicadores usada por scanners de arquivos e de memória.
  desc_en: YARA signature and IOC database used by file and memory scanners.
  tags: [yara, ioc]
- nome: YARA
  repo: VirusTotal/yara
  categoria: regras-de-deteccao
  desc: Ferramenta de correspondência de padrões para identificar e classificar arquivos por regras.
  desc_en: Pattern matching tool to identify and classify files using rules.
