- nome: Zeek
  repo: zeek/zeek
  categoria: deteccao-de-rede
  desc: Framework de análise de rede que transforma o tráfego em logs detalhados de sessões e protocolos.
  desc_en: Network analysis framework that turns traffic into detailed protocol and session logs.
  tags: [nsm, logs]
- nome: Snort 3
  repo: snort3/snort3
  categoria: deteccao-de-rede
  desc: Sistema de detecção e prevenção de intrusão em rede, reescrito com arquitetura modular.
  desc_en: Network intrusion detection and prevention system rewritten with a modular architecture.
