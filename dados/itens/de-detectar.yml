- nome: Sniffnet
  repo: GyulyVGC/sniffnet
  categoria: deteccao-de-rede
  desc: Aplicativo de desktop para acompanhar o tráfego de rede e ver quem a máquina está acessando.
  desc_en: Desktop app to watch network traffic and see which hosts your machine is talking to.
  tags: [trafego, desktop]
- nome: Malcolm
  repo: cisagov/Malcolm
  categoria: deteccao-de-rede
  desc: Conjunto da CISA para análise de tráfego, junta Zeek, Suricata e Arkime numa pilha só.
  desc_en: CISA network traffic analysis suite that bundles Zeek, Suricata and Arkime in one stack.
  tags: [nsm, pcap, cisa]
- nome: Clear NDR (SELKS)
  repo: StamusNetworks/Clear-NDR-ISO
  categoria: deteccao-de-rede
  desc: Distribuição de detecção de rede baseada no Suricata, com interface de caça e gestão de regras.
  desc_en: Suricata-based network detection distribution with a hunting interface and ruleset management.
  tags: [ndr, suricata]
- nome: Maltrail
  repo: stamparm/maltrail
  categoria: deteccao-de-rede
  desc: Sistema que detecta tráfego malicioso comparando o que passa na rede com listas públicas de ameaças.
  desc_en: Malicious traffic detection system that matches network traffic against public threat lists.
  tags: [ids, listas-de-ameacas]
- nome: JA4+
  repo: FoxIO-LLC/ja4
  categoria: deteccao-de-rede
  desc: Padrões de impressão digital de rede (TLS, HTTP, SSH) para identificar clientes e malware.
  desc_en: Network fingerprinting standards (TLS, HTTP, SSH) to identify clients and malware.
  tags: [fingerprint, tls]
