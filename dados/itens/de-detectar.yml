- nome: ntopng
  repo: ntop/ntopng
  categoria: deteccao-de-rede
  desc: Monitor web de tráfego de rede com alertas de segurança e análise de fluxos.
  desc_en: Web-based network traffic monitor with security alerts and flow analysis.
