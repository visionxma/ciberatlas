# Grupo GV (Governar): GRC e conformidade, privacidade e dados pessoais.

# --- grc-e-conformidade
- nome: CISO Assistant
  repo: intuitem/ciso-assistant-community
  categoria: grc-e-conformidade
  desc: "Plataforma GRC aberta: riscos, controles, auditorias e conformidade com mais de 100 frameworks (ISO 27001, NIST, CIS, LGPD)."
  desc_en: "Open GRC platform: risk, controls, audits and compliance across 100+ frameworks (ISO 27001, NIST, CIS, GDPR)."
  tags: [grc, riscos, auditoria, iso27001]
- nome: CSET
  repo: cisagov/cset
  categoria: grc-e-conformidade
  desc: "Ferramenta da CISA para autoavaliar a postura de segurança contra padrões como NIST CSF e CIS Controls."
  desc_en: "CISA tool to self-assess security posture against standards such as NIST CSF and CIS Controls."
  tags: [cisa, nist-csf, autoavaliacao]
- nome: OSCAL
  repo: usnistgov/OSCAL
  categoria: grc-e-conformidade
  desc: "Linguagem do NIST em JSON, XML e YAML para descrever controles, avaliações e planos de segurança de forma legível por máquina."
  desc_en: "NIST language in JSON, XML and YAML to describe controls, assessments and security plans in machine-readable form."
  tags: [nist, oscal, controles]
- nome: Compliance Trestle
  repo: oscal-compass/compliance-trestle
  categoria: grc-e-conformidade
  desc: "Ferramenta Python para gerir conformidade como código com OSCAL do NIST, integrável a pipelines de CI."
  desc_en: "Python tooling to manage compliance as code with NIST OSCAL, ready for CI pipelines."
  tags: [oscal, compliance-as-code]
- nome: Probo
  repo: getprobo/probo
  categoria: grc-e-conformidade
  desc: "Plataforma aberta para preparar e manter conformidade com SOC 2, ISO 27001 e GDPR, com tarefas, evidências e políticas."
  desc_en: "Open platform to prepare and maintain SOC 2, ISO 27001 and GDPR compliance with tasks, evidence and policies."
  tags: [soc2, iso27001, gdpr]
- nome: gapps
  repo: bmarsh9/gapps
  categoria: grc-e-conformidade
  desc: "Plataforma de conformidade que acompanha controles de SOC 2, ISO 27001, NIST CSF, CIS e HIPAA com evidências e políticas."
  desc_en: "Compliance platform tracking SOC 2, ISO 27001, NIST CSF, CIS and HIPAA controls with evidence and policies."
  tags: [grc, soc2, iso27001]

- nome: Deming
  repo: sourcentis/deming
  categoria: grc-e-conformidade
  desc: "Gestão do SGSI (ISO 27001): controles, medições periódicas, plano de ação e acompanhamento de auditorias."
  desc_en: "ISMS management (ISO 27001): controls, periodic measurements, action plans and audit follow-up."
  tags: [iso27001, sgsi]

# --- privacidade-e-dados-pessoais
- nome: Presidio
  repo: data-privacy-stack/presidio
  categoria: privacidade-e-dados-pessoais
  desc: "Framework que detecta, mascara e anonimiza dados pessoais (PII) em texto, imagens e dados estruturados."
  desc_en: "Framework to detect, redact, mask and anonymize personal data (PII) in text, images and structured data."
  tags: [pii, anonimizacao, lgpd]
- nome: Privado
  repo: Privado-Inc/privado
  categoria: privacidade-e-dados-pessoais
  desc: "Análise estática que mapeia fluxos de dados pessoais no código e aponta vazamentos para terceiros."
  desc_en: "Static scanner that maps personal-data flows in code and flags leaks to third parties."
  tags: [fluxo-de-dados, lgpd, codigo]
- nome: HawkEye
  repo: rohitcoder/hawk-eye
  categoria: privacidade-e-dados-pessoais
  desc: "Varre arquivos, bancos, S3 e Redis procurando dados pessoais e segredos expostos nos seus próprios sistemas."
  desc_en: "Scans files, databases, S3 and Redis for exposed personal data and secrets in your own systems."
  tags: [pii, descoberta-de-dados]
- nome: Databunker
  repo: securitybunker/databunker
  categoria: privacidade-e-dados-pessoais
  desc: "Cofre para registros pessoais de clientes com criptografia, consentimento e atendimento a pedidos de titulares."
  desc_en: "Vault for customer personal records with encryption, consent tracking and data-subject request handling."
  tags: [cofre, consentimento, titular]
- nome: CookieConsent
  repo: orestbida/cookieconsent
  categoria: privacidade-e-dados-pessoais
  desc: "Biblioteca JavaScript leve para banner de cookies com consentimento por categoria, compatível com LGPD e GDPR."
  desc_en: "Lightweight JavaScript cookie-consent banner with per-category consent, built for GDPR and LGPD."
  tags: [cookies, consentimento]
- nome: Klaro
  repo: kiprotect/klaro
  categoria: privacidade-e-dados-pessoais
  desc: "Gerenciador de consentimento aberto que bloqueia scripts de terceiros até o visitante autorizar."
  desc_en: "Open consent manager that blocks third-party scripts until the visitor opts in."
  tags: [consentimento, rastreadores]
- nome: ARX
  repo: arx-deidentifier/arx
  categoria: privacidade-e-dados-pessoais
  desc: "Ferramenta de anonimização de dados com k-anonimato e privacidade diferencial, com análise do risco de reidentificação."
  desc_en: "Data anonymization tool with k-anonymity and differential privacy, plus re-identification risk analysis."
  tags: [anonimizacao, k-anonimato]
- nome: OpenDP
  repo: opendp/opendp
  categoria: privacidade-e-dados-pessoais
  desc: "Biblioteca de algoritmos de privacidade diferencial para publicar estatísticas sem expor indivíduos."
  desc_en: "Differential privacy algorithm library to publish statistics without exposing individuals."
  tags: [privacidade-diferencial]
- nome: PIA (CNIL)
  repo: LINCnil/pia
  categoria: privacidade-e-dados-pessoais
  desc: "Aplicação da autoridade francesa CNIL para conduzir relatórios de impacto à proteção de dados (RIPD/DPIA)."
  desc_en: "French CNIL application to carry out data protection impact assessments (DPIA)."
  tags: [ripd, dpia, cnil]
- nome: Blacklight Collector
  repo: the-markup/blacklight-collector
  categoria: privacidade-e-dados-pessoais
  desc: "Coletor que audita um site em busca de rastreadores, cookies de terceiros e fingerprinting."
  desc_en: "Collector that audits a website for trackers, third-party cookies and fingerprinting."
  tags: [rastreadores, auditoria-de-site]
