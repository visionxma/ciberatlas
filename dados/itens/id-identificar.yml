- nome: OpenVAS Scanner
  repo: greenbone/openvas-scanner
  categoria: gestao-de-vulnerabilidades
  desc: "Motor de varredura da Greenbone Community Edition para achar vulnerabilidades em hosts e redes."
  desc_en: "Scanner engine of Greenbone Community Edition to find vulnerabilities on hosts and networks."
  tags: [scanner, rede, greenbone]
- nome: Nuclei
  repo: projectdiscovery/nuclei
  categoria: gestao-de-vulnerabilidades
  desc: "Scanner baseado em modelos YAML da comunidade para testar a própria infraestrutura contra falhas conhecidas."
  desc_en: "Template-based scanner using community YAML templates to test your own infrastructure for known flaws."
