- nome: Retire.js
  repo: RetireJS/retire.js
  categoria: gestao-de-vulnerabilidades
  desc: "Detecta bibliotecas JavaScript com vulnerabilidades conhecidas em sites e projetos; gera SBOM."
  desc_en: "Detects JavaScript libraries with known vulnerabilities in sites and projects; can output an SBOM."
  tags: [javascript, dependencias]
- nome: pip-audit
  repo: pypa/pip-audit
  categoria: gestao-de-vulnerabilidades
  desc: "Audita ambientes e arquivos de requisitos Python em busca de dependências com vulnerabilidades conhecidas."
  desc_en: "Audits Python environments and requirements files for dependencies with known vulnerabilities."
  tags: [python, dependencias]
- nome: RustSec
  repo: rustsec/rustsec
  categoria: gestao-de-vulnerabilidades
  desc: "Banco de avisos de segurança e ferramentas (cargo-audit) para dependências Rust."
  desc_en: "Security advisory database and tooling (cargo-audit) for Rust dependencies."
  tags: [rust, dependencias]
# --- cadeia-de-suprimentos-e-sbom
- nome: Syft
  repo: anchore/syft
  categoria: cadeia-de-suprimentos-e-sbom
  desc: "Gera SBOM a partir de imagens de contêiner e sistemas de arquivos, nos formatos SPDX e CycloneDX."
  desc_en: "Generates SBOMs from container images and filesystems in SPDX and CycloneDX formats."
