- nome: OSV-Scanner
  repo: google/osv-scanner
  categoria: gestao-de-vulnerabilidades
  desc: "Confere as dependências do projeto contra o banco de vulnerabilidades OSV.dev e sugere correções."
  desc_en: "Checks project dependencies against the OSV.dev vulnerability database and suggests fixes."
