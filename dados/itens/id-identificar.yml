- nome: Vulnerability-Lookup
  repo: vulnerability-lookup/vulnerability-lookup
  categoria: gestao-de-vulnerabilidades
  desc: "Plataforma do CIRCL que correlaciona vulnerabilidades de várias fontes e permite buscar e comentar achados."
  desc_en: "CIRCL platform that correlates vulnerabilities from many sources and lets you search and comment findings."
  tags: [cve, circl]
- nome: secureCodeBox
  repo: secureCodeBox/secureCodeBox
  categoria: gestao-de-vulnerabilidades
  desc: "Roda scanners de segurança de forma contínua em Kubernetes e reúne os resultados em um só lugar."
  desc_en: "Runs security scanners continuously on Kubernetes and collects the results in one place."
