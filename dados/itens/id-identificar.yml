- nome: GUAC
  repo: guacsec/guac
  categoria: cadeia-de-suprimentos-e-sbom
  desc: "Agrega SBOMs, atestações e metadados de segurança num grafo para responder o que depende do quê."
  desc_en: "Aggregates SBOMs, attestations and security metadata in a graph to answer what depends on what."
