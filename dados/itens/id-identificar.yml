- nome: SBOM Tool
  repo: microsoft/sbom-tool
  categoria: cadeia-de-suprimentos-e-sbom
  desc: "Ferramenta da Microsoft para gerar SBOMs SPDX em escala a partir de qualquer tipo de artefato."
  desc_en: "Microsoft tool to generate SPDX SBOMs at scale from any kind of artifact."
