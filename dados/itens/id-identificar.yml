- nome: Dependency-Track
  repo: DependencyTrack/dependency-track
  categoria: cadeia-de-suprimentos-e-sbom
  desc: "Plataforma de análise de componentes: recebe SBOMs e acompanha riscos das dependências de todos os projetos."
  desc_en: "Component analysis platform: ingests SBOMs and tracks the risk of dependencies across all projects."
