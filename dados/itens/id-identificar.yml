- nome: GuardDog
  repo: DataDog/guarddog
  categoria: cadeia-de-suprimentos-e-sbom
  desc: "CLI que identifica pacotes PyPI e npm maliciosos antes de entrarem nas suas dependências."
  desc_en: "CLI that identifies malicious PyPI and npm packages before they enter your dependencies."
