- nome: Clair
  repo: quay/clair
  categoria: gestao-de-vulnerabilidades
  desc: "Análise estática de vulnerabilidades em imagens de contêiner, usada por registries como o Quay."
  desc_en: "Static vulnerability analysis of container images, used by registries such as Quay."
