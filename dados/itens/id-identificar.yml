- nome: OpenSSF Scorecard
  repo: ossf/scorecard
  categoria: cadeia-de-suprimentos-e-sbom
  desc: "Pontua a saúde de segurança de projetos open source: revisão de código, dependências, permissões e mais."
  desc_en: "Scores the security health of open source projects: code review, dependencies, permissions and more."
