- nome: python-tuf
  repo: theupdateframework/python-tuf
  categoria: cadeia-de-suprimentos-e-sbom
  desc: "Implementação de referência do TUF, protocolo para distribuir atualizações de software de forma segura."
  desc_en: "Reference implementation of TUF, a protocol to distribute software updates securely."
