- nome: Vuls
  repo: future-architect/vuls
  categoria: gestao-de-vulnerabilidades
  desc: "Scanner sem agente para Linux, FreeBSD, contêineres e bibliotecas, que cruza pacotes com bases de CVE."
  desc_en: "Agentless scanner for Linux, FreeBSD, containers and libraries that matches packages against CVE data."
  tags: [scanner, linux]
- nome: OpenCVE
  repo: opencve/opencve
  categoria: gestao-de-vulnerabilidades
  desc: "Acompanha CVEs por fornecedor e produto e envia alertas quando surge falha nos produtos que você usa."
  desc_en: "Tracks CVEs by vendor and product and alerts when a flaw appears in the products you use."
