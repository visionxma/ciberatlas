- nome: OWASP Dependency-Check
  repo: dependency-check/DependencyCheck
  categoria: gestao-de-vulnerabilidades
  desc: "Análise de composição de software que aponta dependências com vulnerabilidades públicas (CVE)."
  desc_en: "Software composition analysis that flags dependencies with publicly disclosed vulnerabilities (CVE)."
