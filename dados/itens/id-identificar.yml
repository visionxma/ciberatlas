# Grupo ID (Identificar): inventário de ativos, vulnerabilidades, cadeia de suprimentos e modelagem de ameaças.

# --- inventario-de-ativos
- nome: GLPI
  repo: glpi-project/glpi
  categoria: inventario-de-ativos
  desc: "Inventário de ativos de TI, licenças e chamados (ITIL), com agente para descobrir máquinas e softwares."
  desc_en: "IT asset inventory, licenses and service desk (ITIL), with an agent to discover machines and software."
  tags: [inventario, cmdb, helpdesk]
- nome: Snipe-IT
  repo: grokability/snipe-it
  categoria: inventario-de-ativos
  desc: "Gestão de ativos e licenças de TI: quem usa cada equipamento, histórico, check-in e check-out."
  desc_en: "IT asset and license management: who holds each device, history, check-in and check-out."
  tags: [inventario, licencas]
- nome: NetBox
  repo: netbox-community/netbox
  categoria: inventario-de-ativos
  desc: "Fonte da verdade da infraestrutura: IPs, racks, dispositivos, cabos e circuitos, com API."
  desc_en: "Infrastructure source of truth: IPs, racks, devices, cables and circuits, with an API."
  tags: [ipam, dcim, rede]
- nome: Ralph
  repo: allegro/ralph
  categoria: inventario-de-ativos
  desc: "CMDB e gestão de ativos para hardware de data center e escritório, com ciclo de vida e responsáveis."
  desc_en: "CMDB and asset management for data center and office hardware, with lifecycle and owners."
  tags: [cmdb, datacenter]
- nome: Mercator
  repo: sourcentis/mercator
  categoria: inventario-de-ativos
  desc: "Cartografia do sistema de informação: mapeia processos, aplicações, servidores e fluxos para análise de riscos."
  desc_en: "Information system mapping: processes, applications, servers and data flows for risk analysis."
  tags: [cartografia, cmdb]
- nome: NetAlertX
  repo: netalertx/NetAlertX
  categoria: inventario-de-ativos
  desc: "Descobre dispositivos na rede local e avisa quando aparece um equipamento novo ou desconhecido."
  desc_en: "Discovers devices on the local network and alerts when a new or unknown device appears."
  tags: [descoberta, rede-local]
- nome: Cartography
  repo: cartography-cncf/cartography
  categoria: inventario-de-ativos
  desc: "Reúne ativos de nuvem e suas relações em um grafo Neo4j para achar caminhos de exposição."
  desc_en: "Gathers cloud assets and their relationships in a Neo4j graph to find exposure paths."
  tags: [nuvem, grafo]
- nome: CloudQuery
  repo: cloudquery/cloudquery
  categoria: inventario-de-ativos
  desc: "Extrai configuração de nuvem para um banco de dados, base para inventário de ativos e análise de postura."
  desc_en: "Extracts cloud configuration into a database as a base for asset inventory and posture analysis."
  tags: [nuvem, inventario]
- nome: OWASP Amass
  repo: owasp-amass/amass
  categoria: inventario-de-ativos
  desc: "Mapeia a superfície de ataque externa de um domínio: subdomínios, redes e serviços expostos."
  desc_en: "Maps the external attack surface of a domain: subdomains, networks and exposed services."
  tags: [superficie-de-ataque, dns]
- nome: Nmap
  repo: nmap/nmap
  categoria: inventario-de-ativos
  desc: "Descoberta de hosts e serviços na rede, para manter o inventário e achar portas abertas inesperadas."
  desc_en: "Host and service discovery on the network, to keep inventory and find unexpected open ports."
  tags: [rede, portas]
- nome: Nautobot
  repo: nautobot/nautobot
  categoria: inventario-de-ativos
  desc: "Fonte da verdade da rede e plataforma de automação: inventário de dispositivos, IPs e configuração."
  desc_en: "Network source of truth and automation platform: device, IP and configuration inventory."
  tags: [rede, cmdb]

- nome: iTop
  repo: Combodo/iTop
  categoria: inventario-de-ativos
  desc: "CMDB e gestão de serviços de TI (ITSM) para relacionar ativos, serviços, mudanças e incidentes."
  desc_en: "CMDB and IT service management (ITSM) linking assets, services, changes and incidents."
  tags: [cmdb, itsm]
# --- gestao-de-vulnerabilidades
- nome: Trivy
  repo: aquasecurity/trivy
  categoria: gestao-de-vulnerabilidades
  desc: "Varre imagens, repositórios, nuvem e Kubernetes em busca de vulnerabilidades, configurações erradas e segredos."
  desc_en: "Scans images, repositories, cloud and Kubernetes for vulnerabilities, misconfigurations and secrets."
  tags: [scanner, containers, sbom]
- nome: Grype
  repo: anchore/grype
  categoria: gestao-de-vulnerabilidades
  desc: "Scanner de vulnerabilidades para imagens de contêiner e sistemas de arquivos; lê SBOMs do Syft."
